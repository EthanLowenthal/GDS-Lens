<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 'wasm-unsafe-eval' is the whole reason the engine is built with
     -sDYNAMIC_EXECUTION=0: it compiles WebAssembly without needing
     'unsafe-eval'. worker-src blob: is the parse worker. connect-src allows
     https: so a ?src= link can point at a layout hosted anywhere, which is
     what makes a demo shareable. -->
<meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self' https:; img-src 'self' data:;">
<title>GDS Lens - GDSII and OASIS layouts in your browser</title>
<meta name="description" content="Open a GDSII or OASIS chip layout in your browser. No install, no server, and nothing is uploaded.">
<link rel="canonical" href="https://lowenth.al/GDS-Lens/">

<!-- The extension's mark, which is what the Marketplace listing already shows.
     One identity across the three places people meet this. -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1720">

<!-- Link preview. This page exists to be pasted into a pull request, a Slack
     channel and a Show HN, and without these it renders as a bare URL. The
     image is a real screenshot of the viewer (scripts/make-og-image.mjs), not
     a mockup, so the card shows the thing itself. Absolute URLs: scrapers do
     not resolve relative ones. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="GDS Lens">
<meta property="og:url" content="https://lowenth.al/GDS-Lens/">
<meta property="og:title" content="GDS Lens - chip layouts in your browser">
<meta property="og:description" content="Open a GDSII or OASIS layout in your browser. No install, no server, and nothing is uploaded: it parses and renders in the tab.">
<meta property="og:image" content="https://lowenth.al/GDS-Lens/og-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The GDS Lens viewer showing a dense photonic chip layout, with a cell hierarchy and layer panel.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="GDS Lens - chip layouts in your browser">
<meta name="twitter:description" content="Open a GDSII or OASIS layout in your browser. No install, no server, and nothing is uploaded.">
<meta name="twitter:image" content="https://lowenth.al/GDS-Lens/og-preview.png">
<style>
    /* The viewer decides its own theme from the OS preference (its host's
       isLightTheme default), and it is most of the page. So the chrome follows
       the same signal rather than picking a side: a dark shell around a light
       canvas reads as a bug. */
    :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #dde2e8;
        --text: #16202b;
        --dim: #5b6b7b;
        --accent: #0a72b3;
        --btn: #f0f3f6;
        --btn-hover: #e4e9ee;
        --btn-line: #cfd6de;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            color-scheme: dark;
            --bg: #0f1720;
            --panel: #16202b;
            --line: #24313f;
            --text: #e6edf3;
            --dim: #8b9aab;
            --accent: #38bdf8;
            --btn: #1f2b38;
            --btn-hover: #26333f;
            --btn-line: #33445600;
        }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    header {
        display: flex;
        align-items: center;
        gap: 10px 16px;
        flex-wrap: wrap;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
    }
    .brand { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
    .brand span { color: var(--accent); }
    .tagline { color: var(--dim); min-width: 0; }
    nav { display: flex; gap: 14px; align-items: center; margin-left: auto; }
    nav a { color: var(--dim); text-decoration: none; white-space: nowrap; }
    nav a:hover, nav a:focus-visible { color: var(--text); text-decoration: underline; }

    button {
        font: inherit;
        font-weight: 550;
        color: var(--text);
        background: var(--btn);
        border: 1px solid var(--btn-line);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--btn-hover); }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .note { color: var(--dim); min-width: 0; }
    .note code { color: var(--accent); font-size: 0.92em; }

    main { flex: 1; min-height: 0; position: relative; }
    gds-lens { display: block; width: 100%; height: 100%; }

    footer {
        display: flex;
        gap: 6px 14px;
        flex-wrap: wrap;
        padding: 6px 18px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        color: var(--dim);
        font-size: 12px;
    }
    footer a { color: var(--dim); }
    footer a:hover { color: var(--text); }

    @media (max-width: 620px) {
        .tagline { flex: 1 1 100%; }
        .note { flex: 1 1 auto; }
        nav { margin-left: 0; }
    }

    /* On a phone the page is the viewer, so the chrome around it goes: the
       description, the file button and its status line in the header, and the
       what-it-is-built-from line in the footer. Two of those are unusable here
       anyway -- there is no drag-and-drop on touch, and the picker's extension
       filter greys out .gds/.oas in the iOS Files app -- and the rest is
       reading matter competing with the layout for a small screen. The name,
       the links and the build stay. */
    @media (max-width: 620px) {
        .tagline, #open, #status, #stack { display: none; }
        header { padding: 8px 14px; }
        footer { padding: 6px 14px; }
    }
</style>
</head>
<body>

<header>
    <div class="brand">GDS<span>&nbsp;Lens</span></div>
    <div class="tagline">GDSII and OASIS chip layouts, parsed and rendered in the browser.</div>
    <button id="open" type="button">Open a layout</button>
    <input id="file" type="file" accept=".gds,.gds.gz,.oas,.oasis,.oas.gz,.oasis.gz" hidden>
    <span class="note" id="status">Starting the viewer...</span>
    <nav>
        <a href="https://github.com/EthanLowenthal/GDS-Lens">GitHub</a>
        <a href="https://www.npmjs.com/package/gds-lens">npm</a>
        <a href="https://marketplace.visualstudio.com/items?itemName=ethml.GDS-Lens">VS&nbsp;Code&nbsp;extension</a>
    </nav>
</header>

<main>
    <gds-lens id="viewer"></gds-lens>
</main>

<footer>
    <span id="build">gds-lens</span>
    <span id="stack">Parsing is <a href="https://github.com/heitzmann/gdstk">gdstk</a>
        compiled to WebAssembly; rendering is WebGL2.</span>
    <span style="margin-left:auto">
        <a href="https://github.com/EthanLowenthal/GDS-Lens/blob/main/LICENCE.md">MIT</a>
    </span>
</footer>

<!-- Emscripten's output, loaded as a classic script for the global it
     defines. Both of these must precede gds-lens.js, which reads them as it
     starts. -->
<script src="gds-lens-engine.js"></script>
<script src="gds-lens-host.js"></script>
<script src="gds-lens.js"></script>
<script src="demo.js"></script>
</body>
</html>
