<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src {{cspSource}} 'wasm-unsafe-eval'; worker-src blob:;">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0c0c0d; user-select: none; }
        canvas { width: 100%; height: 100%; display: block; }
        /* The engine readout (polygon/label counts + the per-frame #renderStats
           span, both written from renderer.cpp). It lives inside #debugPanel
           rather than floating over the canvas on its own: it's debug-only
           either way, and two separate debug surfaces meant the same command
           lit up two different corners of the screen. */
        #ui { width: 320px; flex: none; overflow-y: auto; padding: 6px 8px; border-right: 1px solid #333;
              color: #a5a5a5; font-family: monospace; font-size: 11px; line-height: 1.5; user-select: text; }
        /* The debug entry point is hidden until the "GDSLens: Toggle Debug
           Tools" command adds .debug to <body>. */
        #debugToggleBtn { display: none; }
        body.debug #debugToggleBtn { display: block; }
        #scaleContainer { position: absolute; bottom: 20px; right: 20px; font-family: monospace; font-size: 11px; color: #ffffff; text-align: center; z-index: 10; pointer-events: none; }
        #scaleBar { height: 4px; background: #ffffff; border: 1px solid #000; margin-top: 4px; }
        /* Ruler readout: repositioned to the measurement's midpoint on every
           redraw by update_measure_label (renderer.cpp). The translate lifts
           it just above the line so it doesn't cover what's being measured. */
        #measureLabel { position: absolute; transform: translate(-50%, -130%); font-family: monospace; font-size: 11px; color: #ffffff; background: rgba(0,0,0,0.75); border: 1px solid #555; border-radius: 3px; padding: 3px 7px; text-align: center; line-height: 1.4; white-space: nowrap; z-index: 15; pointer-events: none; }
        #measureLabel.hidden { display: none; }
        /* lil-gui's autoPlace default (1001) would float the panel above the
           loading overlay (z 30) and debug panel (z 40) -- keep it below both. */
        .lil-gui.autoPlace { z-index: 20 !important; }
        /* Checkbox rows (layer list + top-level toggles): lil-gui gives the
           label a 45% min-width and no overflow handling, so a long name like
           "250/74 – SIN_WG_S" would push into the checkbox column. Widen the
           label (the checkbox needs nowhere near half the row) and cut it
           character-level with an ellipsis. */
        .lil-gui .lil-controller.lil-boolean > .lil-name { min-width: 78%; width: 78%; overflow: hidden; text-overflow: ellipsis; }
        /* Interaction-mode row (Pan | Measure), hand-built in viewer.js since
           lil-gui has no segmented-control type. Because the row carries
           lil-gui's own classes, its button theming (widget color, radius,
           height, :hover/:active) already applies -- all that's left is
           splitting the widget in two and filling in the selected mode. The
           name column is narrower than lil-gui's 45% default to leave both
           buttons a readable width. */
        .lil-gui .lil-controller.mode-row .lil-name { min-width: 30%; }
        .lil-gui .lil-controller.mode-row .mode-widget { gap: 4px; }
        .lil-gui .lil-controller.mode-row .mode-widget button { flex: 1; }
        /* :hover/:active spelled out too -- lil-gui's own button:hover rule
           outranks a bare .mode-active, which would grey out the selected
           mode as soon as the pointer crossed it. */
        .lil-gui .lil-controller.mode-row .mode-widget button.mode-active,
        .lil-gui .lil-controller.mode-row .mode-widget button.mode-active:hover,
        .lil-gui .lil-controller.mode-row .mode-widget button.mode-active:active { background: #4a9eff; color: #06121f; font-weight: bold; }
        /* Loaded-.lyp chip: the row shows the filename with an ✕ on the right
           (injected by setLypChip in viewer.js) to unload it. */
        .lil-gui .lil-controller.lyp-loaded { position: relative; }
        .lil-gui .lil-controller.lyp-loaded .lil-name { padding-right: 22px; }
        .lil-gui .lil-controller.lyp-loaded .lyp-unload { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #ff9a9a; cursor: pointer; font-size: 12px; z-index: 5; }
        .lil-gui .lil-controller.lyp-loaded .lyp-unload:hover { color: #ff4d4d; }
        /* Marker browser (see renderMarkerBrowser in viewer.js): the selected
           violation's row, and the disabled "… N more" overflow row. The row
           is a full-width <button> in lil-gui, so tint the button itself
           (!important also beats lil-gui's :hover/:active backgrounds). */
        .lil-gui .lil-controller.marker-selected button { background: #5a1f1f !important; }
        .lil-gui .lil-controller.marker-selected .lil-name { color: #ffd9d9; }
        .lil-gui .lil-controller.marker-more-row { opacity: 0.55; pointer-events: none; }
        /* "Newer version on disk" header (see the fileChanged handler in
           viewer.js). Sits above the lil-gui panel (z 20) but below the
           loading overlay (z 30), since it's hidden while a load runs
           anyway. */
        /* Stops short of the right edge so it doesn't cover the lil-gui panel
           (260px wide, top-right) that it outranks on z-index. */
        #staleBanner { position: absolute; top: 0; left: 0; right: 276px; box-sizing: border-box; z-index: 25;
                       display: flex; align-items: center; gap: 12px; padding: 7px 12px;
                       font-family: monospace; font-size: 12px; color: #ffe9c2;
                       background: #4a3410; border-bottom: 1px solid #7a5a1c; }
        #staleBanner.hidden { display: none; }
        #staleText { flex: 1; }
        #staleBanner button { font-family: monospace; font-size: 11px; background: #7a5a1c; color: #fff6e5;
                              border: 1px solid #a37a26; border-radius: 3px; padding: 3px 12px; cursor: pointer; }
        #staleBanner button:hover { background: #a37a26; }
        /* Secondary next to Reload: same action plus a persisted setting, so it
           reads as the quieter of the two. */
        #staleBanner button.secondary { background: transparent; border-color: transparent;
                                        color: #e5cfa4; padding: 3px 6px; }
        #staleBanner button.secondary:hover { background: transparent; color: #fff6e5; text-decoration: underline; }
        #staleDismiss { cursor: pointer; opacity: 0.7; padding: 0 2px; }
        #staleDismiss:hover { opacity: 1; }
        #loadingOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: monospace; color: #d0d0d0; background: #0c0c0d; z-index: 30; }
        #loadingOverlay.hidden { display: none; }
        #loadingBarTrack { width: 320px; height: 8px; background: #2a2a2c; border-radius: 4px; overflow: hidden; }
        #loadingBarFill { width: 0%; height: 100%; background: #4a9eff; transition: width 0.15s ease-out; }
        #loadingPhase { font-size: 12px; }
        #loadingPercent { font-size: 11px; color: #808080; }
        /* The reload flavour of the same progress (see beginProgress in
           viewer.js): a hairline bar along the top edge plus a small chip,
           over a viewport that keeps showing the geometry already loaded.
           Restoring the camera across a reload is pointless if the view is
           blacked out while it happens. pointer-events stay off so a drag
           that starts under the chip still pans the canvas. */
        #reloadProgress { position: absolute; top: 0; left: 0; right: 0; z-index: 26; pointer-events: none; }
        #reloadProgress.hidden { display: none; }
        #reloadBarTrack { height: 2px; background: #2a2a2c; }
        #reloadBarFill { width: 0%; height: 100%; background: #4a9eff; transition: width 0.15s ease-out; }
        #reloadLabel { display: inline-block; margin: 6px 0 0 10px; padding: 3px 8px; font-family: monospace;
                       font-size: 11px; color: #cfe6ff; background: rgba(12, 12, 13, 0.85);
                       border: 1px solid #2a3f57; border-radius: 3px; }
        /* Load failures. This is deliberately NOT part of the debug tools:
           #ui above is display:none unless the debug command is run, so an
           error written only there is invisible to a normal user. Empty means
           no error, so setting/clearing the text is all it takes to show or
           hide the panel. */
        #loadError { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 520px; z-index: 35; padding: 16px 20px; background: #2a1416; border: 1px solid #7a2b2b; border-radius: 5px; font-family: monospace; font-size: 12px; line-height: 1.55; color: #ffd9d9; white-space: pre-line; user-select: text; }
        #loadError:empty { display: none; }
        #debugPanel { position: absolute; bottom: 0; left: 0; width: 100%; max-height: 240px; z-index: 40; background: rgba(0,0,0,0.88); border-top: 1px solid #333; display: flex; flex-direction: column; }
        #debugPanel.hidden { display: none; }
        #debugPanelHeader { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; font-family: monospace; font-size: 11px; color: #999; border-bottom: 1px solid #333; }
        #debugPanelHeader button { font-family: monospace; font-size: 10px; background: #2a2a2c; color: #ddd; border: 1px solid #444; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
        /* Readout beside the log rather than above it: the panel is capped at
           240px tall, and stacking them would leave the log a few lines. */
        #debugBody { display: flex; flex: 1; min-height: 0; }
        #debugLog { flex: 1; overflow-y: auto; padding: 6px 8px; font-family: monospace; font-size: 10px; color: #7fff7f; white-space: pre-wrap; word-break: break-all; user-select: text; }
        #debugLog .err { color: #ff7f7f; }
        #debugToggleBtn { position: absolute; bottom: 8px; left: 8px; z-index: 41; font-family: monospace; font-size: 10px; background: #2a2a2c; color: #999; border: 1px solid #444; border-radius: 3px; padding: 2px 8px; cursor: pointer; opacity: 0.6; }
        #debugToggleBtn:hover { opacity: 1; }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div id="loadingBarTrack"><div id="loadingBarFill"></div></div>
        <div id="loadingPhase">Loading layout...</div>
        <div id="loadingPercent"></div>
    </div>
    <div id="loadError"></div>
    <div id="reloadProgress" class="hidden">
        <div id="reloadBarTrack"><div id="reloadBarFill"></div></div>
        <div id="reloadLabel">Reloading...</div>
    </div>
    <div id="staleBanner" class="hidden">
        <span id="staleText">A newer version of this file is on disk.</span>
        <button id="staleReloadBtn" type="button">Reload</button>
        <button id="staleAlwaysBtn" type="button" class="secondary"
                title="Reload now, and automatically whenever this file changes from now on">Always</button>
        <span id="staleDismiss" title="Dismiss until the next change">✕</span>
    </div>
    <canvas id="glCanvas"></canvas>

    <div id="debugPanel" class="hidden">
        <div id="debugPanelHeader">
            <span>Debug tools</span>
            <button id="debugCopyBtn" type="button">Copy log</button>
        </div>
        <div id="debugBody">
            <!-- Engine readout, written from renderer.cpp (set_inner_html("ui", ...)). -->
            <div id="ui"></div>
            <div id="debugLog"></div>
        </div>
    </div>
    <button id="debugToggleBtn" type="button">Debug tools</button>

    <div id="scaleContainer">
        <div id="scaleLabel">0 μm</div>
        <div id="scaleBar" style="width: 100px;"></div>
    </div>

    <div id="measureLabel" class="hidden"></div>

    <!-- Base64 of gdstk_wasm.js's + wasm-worker.js's concatenated text (see
         extension.cjs) -- inert (not executed) since "text/plain" isn't a JS
         mimetype. viewer.js reads this via textContent + atob() to build the
         Worker's Blob script, since neither importScripts() (from the
         Worker) nor fetch() (from this main thread) can reach VS Code's
         webview resource protocol, and pushing this much text through
         postMessage() broke opening the editor entirely. -->
    <script type="text/plain" id="workerBundle">{{workerBundleBase64}}</script>

    <!-- Webview Local Script Injection Pipeline -->
    <script src="wasm/build/gdstk_wasm.js"></script>
    <script src="vendor/lil-gui.umd.min.js"></script>
    <script src="marker-parsers.js"></script>
    <script src="load-errors.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
