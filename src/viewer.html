<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self';">
    <title>GDS Lens</title>
    <style>
        /* The page harness only. Everything the viewer itself draws is styled
           inside its shadow root (see viewer.css), which is why there is so
           little here: a host page cannot reach in, and this cannot leak out. */
        html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; }
        gds-lens { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <gds-lens></gds-lens>

    <!-- Base64 of gdstk_wasm.js's + wasm-worker.js's concatenated text (see
         extension.cjs) -- inert (not executed) since "text/plain" isn't a JS
         mimetype. A host that cannot reach its own asset URLs from a Worker
         reads this and builds the Worker's Blob script from it; see
         createWorker in the VS Code adapter. It lives in the outer document
         rather than the shadow root because it is the host's to fill in. -->
    <script type="text/plain" id="workerBundle">{{workerBundleBase64}}</script>

    <!-- Emscripten's output, loaded as a classic script for the
         createGdstkModule global it defines. -->
    <script src="gdstk_wasm.js"></script>
    <!-- The embedder's ViewerHost. Must precede viewer.js, which reads
         window.gdsLensHost as it starts. Defaults to the plain-page host;
         a host that needs different services replaces this file. -->
    <script src="host.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
